<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chetly - Alternative Rock from Southlake, TX</title>

  <meta property="og:title" content="Chetly" />
  <meta property="og:description" content="Alternative Rock from Southlake, TX" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://chetly.net/" />
  <meta property="og:image" content="https://chetly.net/chetly-social-preview-final.png" />
  <meta property="og:image:type" content="image/png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chetly" />
  <meta name="twitter:description" content="Alternative Rock from Southlake, TX" />
  <meta name="twitter:image" content="https://chetly.net/chetly-social-preview-final.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      color: #fff;
      background-color: #0d0d0d;
      background-image: url('/band-photo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .hero {
      width: min(960px, 100%);
      text-align: center;
      padding: 32px 24px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 4rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
    }

    .tagline {
      font-size: 1.5rem;
      color: #f0f0f0;
      margin-bottom: 32px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 140px;
      padding: 13px 22px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.55);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .btn-spotify {
      border-color: #1ed760;
    }

    .btn-spotify:hover {
      background: rgba(30, 215, 96, 0.25);
    }

    .btn-soundcloud {
      border-color: #ff5500;
    }

    .btn-soundcloud:hover {
      background: rgba(255, 85, 0, 0.25);
    }

    .btn-youtube {
      border-color: #ff0000;
    }

    .btn-youtube:hover {
      background: rgba(255, 0, 0, 0.25);
    }

    .btn-facebook {
      border-color: #1877f2;
    }

    .btn-facebook:hover {
      background: rgba(24, 119, 242, 0.25);
    }

    .btn-contact {
      border-color: #6464ff;
    }

    .btn-contact:hover {
      background: rgba(100, 100, 255, 0.25);
    }

    .btn-unfinished {
      border-color: #f5c542;
    }

    .btn-unfinished:hover {
      background: rgba(245, 197, 66, 0.25);
    }

    @media (max-width: 900px) {
      h1 {
        font-size: 3rem;
        letter-spacing: 4px;
      }

      .tagline {
        font-size: 1.2rem;
      }

      .hero {
        padding: 28px 20px;
      }
    }

    @media (max-width: 560px) {
      .page {
        padding: 18px 12px;
      }

      h1 {
        font-size: 2.2rem;
        letter-spacing: 3px;
      }

      .tagline {
        font-size: 1rem;
        margin-bottom: 24px;
      }

      .buttons {
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        width: 100%;
        min-width: 0;
      }

      .hero {
        padding: 22px 16px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <h1>Chetly</h1>
      <p class="tagline">Alternative Rock • Southlake, TX</p>

      <div class="buttons">
        <a href="https://open.spotify.com/artist/4Cee0x7rehlLlqOc3jftW7?si=CXO9RSMqQXiYuIP8-udS8Q" class="btn btn-spotify" target="_blank" rel="noopener noreferrer">Spotify</a>

        <a href="https://soundcloud.com/chetlymusic" class="btn btn-soundcloud" target="_blank" rel="noopener noreferrer">SoundCloud</a>

        <a href="https://youtube.com/@chetlymusic" class="btn btn-youtube" target="_blank" rel="noopener noreferrer">YouTube</a>

        <a href="https://www.facebook.com/profile.php?id=61560998221902" class="btn btn-facebook" target="_blank" rel="noopener noreferrer">Facebook</a>

        <a href="contact.html" class="btn btn-contact">Contact</a>

        <a href="/unfinished" class="btn btn-unfinished">Unfinished</a>

        <a href="about.html" class="btn">About</a>
      </div>
    </div>
  </div>
</body>
</html>
