<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Chetly</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #fff;
  background-image: url('/band-photo.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
}

.wrap {
  position: relative;
  z-index: 1;
  width: min(800px, 92%);
  margin: 60px auto;
}

.card {
  background: rgba(20,20,20,0.85);
  padding: 30px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
  text-align: center;
}

h1 {
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

p {
  font-size: 1.1rem;
  line-height: 1.7;
}

.email {
  display: block;
  margin-top: 20px;
  font-size: 1.2rem;
  font-weight: bold;
  color: #f5c542;
  text-decoration: none;
}

.email:hover {
  text-decoration: underline;
}

.btn {
  display: inline-block;
  margin-top: 30px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.3);
  background: rgba(0,0,0,0.7);
  color: #fff;
  text-decoration: none;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
}
</style>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png"></head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Contact</h1>

    <p>For press, music, collaboration, or general inquiries, get in touch with the band.</p>

    <a href="mailto:chetlymusic@gmail.com" class="email">
      chetlymusic@gmail.com
    </a>

    <a href="/" class="btn">Back to Home</a>

  </div>
</div>

</body>
</html>
