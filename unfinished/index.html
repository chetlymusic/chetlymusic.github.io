<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UNFINISHED</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: #fff;
  position: relative;
}

/* Blurred band photo background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url('/band-photo.jpg');
  background-size: cover;
  background-position: center;
  filter: blur(18px);
  transform: scale(1.1);
  z-index: 0;
}

/* Dark overlay */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 0;
}

/* Card container */
.card {
  position: relative;
  z-index: 1;
  width: min(900px, 92%);
  margin: 6vh auto;
  padding: 26px;
  border-radius: 16px;
  background: rgba(20,20,20,0.78);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  text-align: center;
}

/* Meme image — native size (no upscaling) */
.hero {
  width: auto;
  height: auto;
  max-width: 100%;
  display: block;
  margin: 0 auto 18px auto;
  border-radius: 12px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.7);
}

/* Title */
h1 {
  letter-spacing: 3px;
  text-transform: uppercase;
  margin: 10px 0 16px 0;
}

/* Text */
p {
  font-size: 1.15rem;
  margin-bottom: 18px;
  color: #f2f2f2;
}

/* Input row */
.row {
  display: flex;
  gap: 10px;
  justify-content: center;
}

input {
  flex: 1;
  max-width: 280px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.1);
  color: #fff;
}

button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: #f5c542;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.05);
}

.err {
  color: #ff8f8f;
  display: none;
  margin-top: 10px;
}

/* Player */
.player-wrap iframe {
  width: 100%;
  height: 950px;
  border: none;
  border-radius: 12px;
  margin-top: 20px;
}

/* Lock button */
.lock-btn {
  margin-top: 20px;
  background: #ddd;
  color: #111;
}

/* Mobile */
@media (max-width: 600px) {
  .row { flex-direction: column; }
  input, button { width: 100%; }
  .player-wrap iframe { height: 800px; }
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div class="card" id="gate">
  <img src="/Lucky.jpeg" class="hero" alt="Chetly image">

  <h1>UNFINISHED</h1>
  <p>Private band page. Enter password to continue.</p>

  <div class="row">
    <input id="pw" type="password" placeholder="Password">
    <button id="btn">Unlock</button>
  </div>

  <div class="err" id="err">Incorrect password.</div>
</div>

<!-- CONTENT -->
<div class="card" id="content" style="display:none;">
  <img src="/Lucky.jpeg" class="hero">

  <h1>UNFINISHED</h1>

  <p>
    If you are viewing this page, you agree that you will not share the content
    without the band's permission.
  </p>

  <p>
    Here is the current private playlist of unfinished songs:
  </p>

  <div class="player-wrap">
    <iframe
      allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A2220315515%3Fsecret_token%3Ds-7qe3bCtei2o&visual=false">
    </iframe>
  </div>

  <button class="lock-btn" onclick="logout()">Lock Page</button>
</div>

<script>
const HASH = "368d90c41d74aedc06641dffbef6ce54be38d20580a4a59264c325105e2695f9";

const gate = document.getElementById("gate");
const content = document.getElementById("content");
const pw = document.getElementById("pw");
const err = document.getElementById("err");

async function hash(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

document.getElementById("btn").onclick = async () => {
  if (await hash(pw.value) === HASH) {
    gate.style.display = "none";
    content.style.display = "block";
  } else {
    err.style.display = "block";
  }
};

function logout(){
  localStorage.removeItem("chetly_unfinished_unlocked_v1");
  location.reload();
}

pw.addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btn").click();
});
</script>

</body>
</html>
