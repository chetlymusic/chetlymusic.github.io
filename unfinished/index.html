<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNFINISHED</title>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 24px;
      line-height: 1.5;
      background: #f7f7f7;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("/chetly-logo.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 70%;
      opacity: 0.15;
      filter: blur(18px);
      z-index: -1;
    }

    .card {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(2px);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      text-transform: uppercase;
      margin: 0 0 16px 0;
      font-size: 1.8rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 16px;
    }

    .hero-image {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #111;
      color: #fff;
    }

    .err {
      color: #b00020;
      display: none;
      margin-top: 8px;
    }

    #content {
      display: none;
      margin-top: 16px;
    }

    .player-wrap iframe {
      width: 100%;
      height: 500px;
      border-radius: 10px;
      border: none;
    }

    .soundcloud-credit {
      font-size: 10px;
      margin-top: 4px;
      color: #aaa;
      text-align: center;
    }

    .soundcloud-credit a {
      color: #aaa;
      text-decoration: none;
    }

    /* iPhone optimization */
    @media (max-width: 420px) {
      body {
        margin: 12px;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }

      .player-wrap iframe {
        height: 420px;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="gate">
    <h1>UNFINISHED</h1>
    <p>This page is not public.</p>

    <div class="row">
      <input id="pw" type="password" placeholder="Password" />
      <button id="btn">Unlock</button>
    </div>

    <div class="err" id="err">Incorrect password.</div>
  </div>

  <div class="card" id="content">
    <img src="/band-photo.jpg" class="hero-image" />

    <h1>UNFINISHED</h1>

    <p>
      If you are viewing this page, you agree that you will not share the content without permission.
    </p>

    <p>
      Here is the current private playlist:
    </p>

    <div class="player-wrap">
      <iframe
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A2220315515%3Fsecret_token%3Ds-7qe3bCtei2o&visual=false">
      </iframe>

      <div class="soundcloud-credit">
        <a href="https://soundcloud.com/chetlymusic" target="_blank">Chetly</a>
        ·
        <a href="https://soundcloud.com/chetlymusic/sets/unfinished/s-7qe3bCtei2o" target="_blank">Unfinished</a>
      </div>
    </div>
  </div>

  <script>
    const HASH = "368d90c41d74aedc06641dffbef6ce54be38d20580a4a59264c325105e2695f9";

    const gate = document.getElementById("gate");
    const content = document.getElementById("content");
    const pw = document.getElementById("pw");
    const err = document.getElementById("err");

    async function hash(text){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }

    document.getElementById("btn").onclick = async () => {
      if (await hash(pw.value) === HASH) {
        gate.style.display = "none";
        content.style.display = "block";
      } else {
        err.style.display = "block";
      }
    };

    pw.addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("btn").click();
    });
  </script>

</body>
</html>
