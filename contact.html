<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Contact | Chetly</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #fff;
  background-image: url('/band-photo.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
}

.wrap {
  position: relative;
  z-index: 1;
  width: min(800px, 92%);
  margin: 60px auto;
}

.card {
  background: rgba(20,20,20,0.85);
  padding: 30px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
  text-align: center;
}

h1 {
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

p {
  font-size: 1.1rem;
  line-height: 1.7;
}

.email {
  display: block;
  margin-top: 20px;
  font-size: 1.2rem;
  font-weight: bold;
  color: #f5c542;
  text-decoration: none;
}

.email:hover {
  text-decoration: underline;
}

.btn {
  display: inline-block;
  margin-top: 30px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.3);
  background: rgba(0,0,0,0.7);
  color: #fff;
  text-decoration: none;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
}

.card {text-align:left; max-width:680px; margin:auto;}
h1 {text-align:center;}
.intro {margin:0 0 24px;}
form {display:grid; gap:9px;}
form label {font-weight:700; margin-top:10px; font-size:.95rem;}
form label small {font-weight:400; color:#cbd5e1;}
form input:not([type="hidden"]):not(.honeypot), form textarea {
 box-sizing:border-box; width:100%; background:#101b2b; border:1px solid #63738a;
 border-radius:9px; padding:12px 13px; font:inherit; color:white;
}
form input:focus,form textarea:focus {outline:2px solid #f2a75e; outline-offset:1px;}
form textarea {resize:vertical; min-height:150px;}
form input::placeholder,form textarea::placeholder {color:#aab6c6;}
.send-btn {margin-top:16px; padding:14px 20px; border:0; border-radius:9px;
 background:#e98b3c; color:#101923; font:inherit; font-weight:800; cursor:pointer;}
.send-btn:hover {background:#ffab65;}
.form-note {font-size:.78rem; color:#cbd5e1; line-height:1.5; margin:5px 0 0;}
.honeypot {position:absolute; left:-9999px; width:1px; height:1px; opacity:0;}
.btn {display:table; margin:28px auto 0;}
@media(max-width:600px){.wrap{margin:25px auto}.card{padding:22px}}
</style>
<script async="" src="https://www.googletagmanager.com/gtag/js?id=G-ZX1LXJDPMG"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-ZX1LXJDPMG');document.addEventListener('click',function(e){const a=e.target.closest('a[href]');if(!a)return;try{const u=new URL(a.href,location.href);if(!/^https?:$/.test(u.protocol)||u.hostname.replace(/^www\./,'')===location.hostname.replace(/^www\./,''))return;gtag('event','outbound_click',{destination:u.hostname,link_text:(a.textContent||'').trim().slice(0,120),link_url:u.href})}catch(_){}});</script></head>
<body>
<div class="wrap">
<div class="card">
<h1>Contact</h1>
<p class="intro">Chetly isn't booking shows at this time. For other inquiries, questions, or licensing requests, please submit below:</p>
<form action="https://formsubmit.co/chetlymusic@gmail.com" id="contact-form" method="POST">
<input name="_template" type="hidden" value="table"/>
<input id="mail-subject" name="_subject" type="hidden" value="Chetly website inquiry"/>
<input aria-hidden="true" autocomplete="off" class="honeypot" name="_honey" tabindex="-1" type="text"/>
<label for="reply-email">Return Email <span aria-hidden="true">*</span></label>
<input autocomplete="email" id="reply-email" maxlength="254" name="email" placeholder="you@example.com" required="" type="email"/>
<label for="phone">Phone Number <small>(optional)</small></label>
<input autocomplete="tel" id="phone" maxlength="40" name="phone" placeholder="(555) 123-4567" type="tel"/>
<label for="related-url">Related URL <small>(optional)</small></label>
<input id="related-url" maxlength="500" name="related_url" placeholder="https://example.com" type="url"/>
<label for="subject">Subject <span aria-hidden="true">*</span></label>
<input id="subject" maxlength="150" name="subject" placeholder="What's this about?" required="" type="text"/>
<label for="message">Message <span aria-hidden="true">*</span></label>
<textarea id="message" maxlength="10000" name="message" placeholder="Your message..." required="" rows="7"></textarea>
<button class="send-btn" type="submit">Send Message</button>
<p class="form-note">Fields marked * are required. Your message is handled by FormSubmit and sent to Chetly's email inbox.</p>
</form>
<a class="btn" href="/">Back to Home</a>
</div>
</div>
<script>
  document.getElementById('contact-form').addEventListener('submit', function () {
    const subject = document.getElementById('subject').value.trim();
    document.getElementById('mail-subject').value = 'Chetly website: ' + subject.slice(0, 120);
  });
</script>
</body>
</html>
